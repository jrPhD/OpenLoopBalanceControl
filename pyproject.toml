[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openloopbalancecontrol"
version = "0.1.0"
description = "Open loop balance control project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opty",
    "pydy",
]

# Configure the Git sources for PyPI/uv backend
[tool.uv.sources]
opty = { git = "https://github.com/csu-hmc/opty" }
pydy = { git = "https://github.com/pydy/pydy" }

# Pixi workspace configuration (channel & cross-platform targets)
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# Conda dependencies from your original environment.yml
[tool.pixi.dependencies]
bicycleparameters = "==1.3.0"
cloudpickle = "*"
cyipopt = "*"
cython = "*"
ipython = "*"
matplotlib = "*"
numpy = "*"
packaging = "*"
pandas = "*"
pillow = "*"
scienceplots = "==2.1.1"
"scikits.odes" = "==3.1.1"
scipy = "*"
setuptools = "*"
symbrim = "==0.1.0"
symmeplot = "==0.2.1"
sympy = "==1.14.0"
uncertainties = "==3.2.3"
yeadon = "==1.5.0"

# Optional: If this project folder itself contains installable source code
[tool.pixi.pypi-dependencies]
openloopbalancecontrol = { path = ".", editable = true }
